<html>
<head>
<title>Update products</title>
</head>
<body>
	<h1>Update Product</h1>
	<div>
		<label>Id</label><br>
        <input type="number" [(ngModel)]="product.id" disabled="true">
        <br>
        <br>
        <label>Name</label><br>
        <input type="text" [(ngModel)]="product.name">
        <br><br>
        <label>Description</label><br>
        <textarea [(ngModel)]="product.description"></textarea>
        <br><br>
        <label>Price</label><br>
        <input type="number" [(ngModel)]="product.price">
        <br><br>
        <button (click)="updateNewProduct()">Update Product</button>
        <br><br>
    </div>
</body>
</html>
